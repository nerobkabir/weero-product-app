version: '3.8'

networks:
  app-network:
    driver: bridge

services:

  # ── Backend ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: weero-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    networks:
      - app-network

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    container_name: weero-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network